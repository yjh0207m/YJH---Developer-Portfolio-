# ──────────────────────────────────────────────
# HikariCP — 유휴 연결 유지 설정
# MariaDB 서버가 장시간 미사용 연결을 끊기 전에
# 커넥션 풀이 먼저 정리·검증하도록 설정
# ──────────────────────────────────────────────

# 60초마다 keepalive 쿼리를 날려 연결을 유지
spring.datasource.hikari.keepalive-time=60000

# 연결 빌리기 전 유효성 검사 쿼리
spring.datasource.hikari.connection-test-query=SELECT 1

# 최소 유휴 연결 수 — 항상 1개는 준비 상태 유지
spring.datasource.hikari.minimum-idle=1

# 연결 최대 수명 10분 (MariaDB wait_timeout 보다 짧게)
spring.datasource.hikari.max-lifetime=600000

# 유휴 연결 제거 기준 5분
spring.datasource.hikari.idle-timeout=300000

# 연결 획득 타임아웃 30초
spring.datasource.hikari.connection-timeout=30000

# SQL 초기화 비활성화 (schema.sql / data.sql 자동 실행 방지)
spring.sql.init.mode=never
